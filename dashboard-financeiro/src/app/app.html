@if (authService.isAuthReady()) {
  @if (authService.currentUser()) {
    <div class="app-shell">
      <!-- Header só visível em telas pequenas -->
      <header class="mobile-header d-lg-none d-flex align-items-center justify-content-between p-3 bg-white border-bottom">
        <div class="d-flex align-items-center gap-2">
          <div class="logo-icon">
            <i class="bi bi-graph-up-arrow"></i>
          </div>
          <span class="fw-bold fs-6">FinFlow</span>
        </div>
        <button class="btn btn-outline-secondary btn-sm" (click)="toggleSidebar()">
          <i class="bi bi-list fs-5"></i>
        </button>
      </header>

      <!-- Backdrop escurecido, só aparece com sidebar aberta no mobile -->
      @if (isSidebarOpen()) {
        <div class="sidebar-backdrop d-lg-none" (click)="closeSidebar()"></div>
      }

      <div class="d-flex">
        <aside
          class="sidebar d-flex flex-column p-3 bg-white border-end"
          [class.sidebar-open]="isSidebarOpen()"
        >
          <div class="d-flex align-items-center gap-2 mb-4 d-none d-lg-flex">
            <div class="logo-icon">
              <i class="bi bi-graph-up-arrow"></i>
            </div>
            <span class="fw-bold fs-5">FinFlow</span>
          </div>

          <nav class="nav flex-column gap-1">
            <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
              <i class="bi bi-grid-1x2 me-2"></i> Dashboard
            </a>
            <a routerLink="/transactions" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
              <i class="bi bi-card-list me-2"></i> Transações
            </a>
            <a routerLink="/import" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
              <i class="bi bi-cloud-upload me-2"></i> Importar
            </a>
          </nav>

          <div class="mt-auto pt-3 border-top">
            <div class="d-flex align-items-center gap-2 mb-2">
              <div class="avatar-placeholder"></div>
              <div class="text-truncate">
                <div class="fw-semibold small text-truncate">{{ authService.currentUser()?.email }}</div>
              </div>
            </div>
            <button class="btn btn-sm btn-outline-secondary w-100" (click)="onLogout()">
              <i class="bi bi-box-arrow-right me-1"></i> Sair
            </button>
          </div>
        </aside>

        <main class="main-content flex-grow-1 overflow-auto bg-light p-3 p-lg-4">
          <router-outlet />
        </main>
      </div>
    </div>
  } @else {
    <router-outlet />
  }
}
