@if (loading()) {
  <p>Carregando...</p>
} @else if (error()) {
  <p class="error">Erro ao carregar transações.</p>
} @else {
  <div class="summary-cards">
    <div class="card">
      <span>Saldo</span>
      <strong>{{ balance() | currency:'BRL' }}</strong>
    </div>
    <div class="card income">
      <span>Receitas</span>
      <strong>{{ totalIncome() | currency:'BRL' }}</strong>
    </div>
    <div class="card expense">
      <span>Despesas</span>
      <strong>{{ totalExpense() | currency:'BRL' }}</strong>
    </div>
  </div>
  @if (expensesByCategory().length > 0) {
  <div class="chart-container">
    <h3>Despesas por categoria</h3>
    <app-pie-chart [data]="expensesByCategory()" />
  </div>
}
}
