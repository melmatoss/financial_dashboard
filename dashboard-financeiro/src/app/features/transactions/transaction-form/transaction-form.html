<form [formGroup]="form" (ngSubmit)="onSubmit()" class="transaction-form">
  <div class="field">
    <label for="description">Descrição</label>
    <input id="description" type="text" formControlName="description" />
    @if (form.controls.description.invalid && form.controls.description.touched) {
      <span class="error">Descrição precisa ter pelo menos 3 caracteres.</span>
    }
  </div>

  <div class="field">
    <label for="amount">Valor</label>
    <input id="amount" type="number" step="0.01" formControlName="amount" />
    @if (form.controls.amount.invalid && form.controls.amount.touched) {
      <span class="error">Informe um valor maior que zero.</span>
    }
  </div>

  <div class="field">
    <label for="type">Tipo</label>
    <select id="type" formControlName="type">
      <option value="expense">Despesa</option>
      <option value="income">Receita</option>
    </select>
  </div>

  <div class="field">
    <label for="date">Data</label>
    <input id="date" type="date" formControlName="date" />
  </div>

  <div class="field">
    <label for="categoryId">Categoria</label>
    <select id="categoryId" formControlName="categoryId">
      <option value="food">Alimentação</option>
      <option value="salary">Salário</option>
      <option value="other">Outros</option>
    </select>
  </div>

  <div class="actions">
    <button type="button" (click)="onCancel()">Cancelar</button>
    <button type="submit">Salvar</button>
  </div>
</form>
