<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="fw-semibold mb-0">Nova transação</h5>
  <button type="button" class="btn-close" (click)="onCancel()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="description" class="form-label">Descrição</label>
    <input
      id="description"
      type="text"
      class="form-control"
      [class.is-invalid]="form.controls.description.invalid && form.controls.description.touched"
      formControlName="description"
    />
    @if (form.controls.description.invalid && form.controls.description.touched) {
      <div class="invalid-feedback">
        Descrição precisa ter pelo menos 3 caracteres.
      </div>
    }
  </div>

  <div class="row">
    <div class="col-7 mb-3">
      <label for="amount" class="form-label">Valor</label>
      <div class="input-group">
        <span class="input-group-text">R$</span>
        <input
          id="amount"
          type="number"
          step="0.01"
          class="form-control"
          [class.is-invalid]="form.controls.amount.invalid && form.controls.amount.touched"
          formControlName="amount"
        />
      </div>
      @if (form.controls.amount.invalid && form.controls.amount.touched) {
        <div class="invalid-feedback d-block">
          Informe um valor maior que zero.
        </div>
      }
    </div>

    <div class="col-5 mb-3">
      <label for="type" class="form-label">Tipo</label>
      <select id="type" class="form-select" formControlName="type">
        <option value="expense">Despesa</option>
        <option value="income">Receita</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-6 mb-3">
      <label for="date" class="form-label">Data</label>
      <input id="date" type="date" class="form-control" formControlName="date" />
    </div>

    <div class="col-6 mb-3">
      <label for="categoryId" class="form-label">Categoria</label>
      <select id="categoryId" class="form-select" formControlName="categoryId">
        <option value="food">Alimentação</option>
        <option value="salary">Salário</option>
        <option value="other">Outros</option>
      </select>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button type="submit" class="btn btn-dark">
      Salvar
    </button>
  </div>
</form>
